<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ResilienceGuard MVP Architecture</title>
  <desc id="desc">A local dashboard checks sample backup files and service requirements during three disruption scenarios. Original samples are read-only. A person may approve copying one sample into a separate test folder. The optional AI model can explain supplied evidence but cannot approve or run a restore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fa"/><stop offset="1" stop-color="#eaf1f3"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142c43"/><stop offset="1" stop-color="#1d4258"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f3ef"/><stop offset="1" stop-color="#f5faf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#18374a" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#5b8992"/></marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6d9a9b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#213b50}.title{font-size:30px;font-weight:700;letter-spacing:-.5px}.subtitle{font-size:13px;fill:#6e8392}.section{font-size:10px;font-weight:bold;letter-spacing:1.6px;fill:#77909c}.box-title{font-size:16px;font-weight:bold}.body{font-size:11px;fill:#657b88}.small{font-size:9px;fill:#7a9099}.tiny{font-size:8px;fill:#78909a}.tag{font-size:8px;font-weight:bold;letter-spacing:.8px}.line{stroke:#78a0a5;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#78a0a5;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow-dash)}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="58" y="62" class="title">ResilienceGuard</text>
  <text x="58" y="89" class="subtitle">A local demo that checks backups, service needs, and isolated test copies</text>
  <rect x="1130" y="42" width="252" height="30" rx="15" fill="#e2f2ec" stroke="#cce6da"/>
  <circle cx="1148" cy="57" r="4" fill="#278b72"/><text x="1160" y="60" class="tag" fill="#337d68">SYNTHETIC DATA · NO PRODUCTION CONNECTORS</text>

  <text x="58" y="149" class="section">OPERATOR EXPERIENCE</text>
  <text x="407" y="149" class="section">RULE-BASED RECOVERY CHECKS</text>
  <text x="1010" y="149" class="section">SAVED EVIDENCE &amp; ISOLATED TEST</text>

  <g filter="url(#shadow)">
    <rect x="58" y="176" width="288" height="360" rx="14" fill="#fff" stroke="#dce6e9"/>
    <rect x="58" y="176" width="288" height="67" rx="14" fill="url(#navy)"/>
    <path d="M58 229h288v14H58z" fill="#1a374d"/>
    <circle cx="88" cy="208" r="15" fill="#20777a"/><path d="m88 196 9 4v6c0 6-4 9-9 11-5-2-9-5-9-11v-6z" fill="none" stroke="#d7f3eb" stroke-width="1.6"/>
    <text x="114" y="207" font-size="15" font-weight="bold" fill="#fff">ResilienceGuard UI</text>
    <text x="114" y="224" font-size="9" fill="#a9c0cb">Web dashboard · React 19 · TypeScript</text>
    <rect x="79" y="263" width="246" height="51" rx="8" fill="#f6f9fa" stroke="#e8eef0"/>
    <text x="94" y="283" class="tag" fill="#68818c">SCENARIO SELECTOR</text><text x="94" y="300" class="small">Physical · Ransomware · Power/network</text>
    <rect x="79" y="328" width="246" height="51" rx="8" fill="#f6f9fa" stroke="#e8eef0"/>
    <text x="94" y="348" class="tag" fill="#68818c">EVIDENCE DASHBOARD</text><text x="94" y="365" class="small">Backup age · service blockers · recovery targets</text>
    <rect x="79" y="393" width="246" height="51" rx="8" fill="#f6f9fa" stroke="#e8eef0"/>
    <text x="94" y="413" class="tag" fill="#68818c">HUMAN APPROVAL</text><text x="94" y="430" class="small">Approve or reject a test-folder copy</text>
    <rect x="79" y="458" width="246" height="51" rx="8" fill="#eaf5f2" stroke="#d5ebe3"/>
    <text x="94" y="478" class="tag" fill="#448273">DOWNLOADS</text><text x="94" y="495" class="small">Evidence PDF · restored sample · audit trail</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="407" y="176" width="546" height="360" rx="14" fill="#fff" stroke="#dce6e9"/>
    <rect x="407" y="176" width="546" height="67" rx="14" fill="url(#navy)"/>
    <path d="M407 229h546v14H407z" fill="#1a374d"/>
    <rect x="433" y="192" width="31" height="31" rx="8" fill="#d7f1e8"/><text x="443" y="213" font-size="16" font-weight="bold" fill="#177b78">A</text>
    <text x="477" y="207" font-size="15" font-weight="bold" fill="#fff">Recovery rules service</text>
    <text x="477" y="224" font-size="9" fill="#a9c0cb">FastAPI · Python · validated data</text>
    <rect x="431" y="261" width="235" height="99" rx="9" fill="#f4f8fa" stroke="#e2ebee"/>
    <text x="448" y="283" class="box-title">Assurance engine</text>
    <text x="448" y="303" class="body">File fingerprint · age · site availability</text>
    <text x="448" y="322" class="body">Data-loss / recovery-time target gaps</text>
    <rect x="448" y="334" width="117" height="15" rx="7" fill="#e4f1ec"/><text x="457" y="345" class="tiny" fill="#38806e">DETERMINISTIC RULES</text>
    <rect x="682" y="261" width="244" height="99" rx="9" fill="#f4f8fa" stroke="#e2ebee"/>
    <text x="699" y="283" class="box-title">Service requirements map</text>
    <text x="699" y="303" class="body">Shows which systems need each other</text>
    <text x="699" y="322" class="body">Finds missing needs · sets restore order</text>
    <rect x="699" y="334" width="135" height="15" rx="7" fill="#e4f1ec"/><text x="708" y="345" class="tiny" fill="#38806e">RULES OWN CONTROL</text>
    <rect x="431" y="376" width="235" height="112" rx="9" fill="#f3f7fa" stroke="#e2ebee"/>
    <text x="448" y="400" class="box-title">Governed workflow</text>
    <text x="448" y="420" class="body">Propose → human decision → restore</text>
    <text x="448" y="439" class="body">Pending actions cannot execute</text>
    <text x="448" y="458" class="body">Audit decisions and results</text>
    <text x="448" y="476" class="small">Only synthetic files · fixed output root</text>
    <rect x="682" y="376" width="244" height="112" rx="9" fill="url(#teal)" stroke="#d9ebe6"/>
    <text x="699" y="400" class="box-title">Advisory assistant</text>
    <text x="699" y="420" class="body">Optional local AI model</text>
    <text x="699" y="439" class="body">Explains supplied evidence only</text>
    <text x="699" y="458" class="body">Cannot approve or run recovery</text>
    <text x="699" y="476" class="small">Fixed-rule response if model is offline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="176" width="372" height="199" rx="14" fill="#fff" stroke="#dce6e9"/>
    <rect x="1033" y="197" width="41" height="37" rx="9" fill="#eef4f7"/><path d="M1043 208h20m-20 7h20m-20 7h14" stroke="#527f93" stroke-width="1.7" stroke-linecap="round"/>
    <text x="1086" y="211" class="box-title">Saved workflow records</text>
    <text x="1086" y="229" class="small">PostgreSQL 18 database</text>
    <text x="1033" y="267" class="body">• Proposed, approved, or rejected tests</text>
    <text x="1033" y="288" class="body">• Test results and measured time</text>
    <text x="1033" y="309" class="body">• Human decisions and audit history</text>
    <rect x="1033" y="331" width="324" height="24" rx="5" fill="#f3f7f8"/><text x="1043" y="347" class="small">SQLite option available for quick single-user local run</text>

    <rect x="1010" y="397" width="372" height="139" rx="14" fill="#fff" stroke="#dce6e9"/>
    <rect x="1033" y="417" width="41" height="37" rx="9" fill="#e7f3ef"/><path d="M1042 428h23v17h-23zM1047 424v4m13-4v4m-13 21v3m13-3v3" fill="none" stroke="#378875" stroke-width="1.5"/>
    <text x="1086" y="431" class="box-title">Separate isolated test folder</text>
    <text x="1086" y="449" class="small">Copy + fingerprint + sample-data check</text>
    <text x="1033" y="482" class="body">Original sample files are read-only</text><text x="1033" y="501" class="body">Each approved test gets its own folder</text>
    <rect x="1033" y="512" width="324" height="14" rx="7" fill="#e9f5ef"/><text x="1041" y="522" class="tiny" fill="#36826c">NO PRODUCTION ACCESS OR MUTATION</text>
  </g>

  <path d="M346 357h48" class="line"/><text x="352" y="344" class="tiny">scenario + review</text>
  <path d="M953 294h48" class="line"/><text x="956" y="280" class="tiny">events</text>
  <path d="M953 445h48" class="line"/><text x="957" y="431" class="tiny">approved restore</text>
  <path d="M1010 555H941" class="dash"/><text x="949" y="572" class="tiny">observed test evidence</text>

  <rect x="58" y="598" width="1324" height="223" rx="14" fill="#fff" stroke="#dce6e9" filter="url(#shadow)"/>
  <text x="83" y="630" class="section">SYNTHETIC INVENTORY INPUTS</text>
  <text x="83" y="656" class="box-title">Repeatable synthetic sample data</text>
  <text x="83" y="679" class="body">Service list · recovery targets · requirements · 5 backup records · 3 disruptions</text>
  <rect x="83" y="703" width="203" height="42" rx="7" fill="#f4f8fa" stroke="#e4ecef"/><text x="99" y="721" class="tag" fill="#547688">SCENARIO A</text><text x="99" y="736" class="small">Primary data center loss</text>
  <rect x="298" y="703" width="203" height="42" rx="7" fill="#f4f8fa" stroke="#e4ecef"/><text x="314" y="721" class="tag" fill="#547688">SCENARIO B</text><text x="314" y="736" class="small">Ransomware / corrupted snapshot</text>
  <rect x="513" y="703" width="227" height="42" rx="7" fill="#f4f8fa" stroke="#e4ecef"/><text x="529" y="721" class="tag" fill="#547688">SCENARIO C</text><text x="529" y="736" class="small">Power + network + backup-site loss</text>
  <rect x="782" y="632" width="566" height="133" rx="11" fill="#f3faf7" stroke="#d9ebe3"/>
  <text x="805" y="660" class="box-title" fill="#286d5a">Assurance boundary</text>
  <text x="805" y="684" class="body">• A matching fingerprint means the file matches its reference; it does not prove the file is malware-free.</text>
  <text x="805" y="705" class="body">• The test copies a sample data file; no database server or app is restored.</text>
  <text x="805" y="726" class="body">• AI cannot run recovery; a person must approve each isolated test.</text>
  <text x="805" y="747" class="small">Production integrations, malware scanning and multi-user identity are future work.</text>

  <path d="M212 536v45h-60v17" class="dash"/>
  <path d="M680 536v45" class="dash"/>
  <path d="M1195 536v45" class="dash"/>
  <text x="58" y="862" class="tiny">ResilienceGuard · Architecture v1.0 · synthetic demo only</text>
  <text x="1190" y="862" class="tiny">Local-first · deterministic safety gates</text>
</svg>
